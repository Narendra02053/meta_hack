name: "WarehousePriorityEnv"
description: "A high-fidelity warehouse simulation environment for testing AI agents on order fulfillment, inventory management, and deadline prioritization."
version: "1.0.0"
author: "Narendra <nn7116580@gmail.com>"
tags:
  - "openenv"
  - "supply-chain"
  - "logistics"
  - "task-planning"

environment:
  observation_space:
    inventory: "dict[str, int] - Current stock levels"
    current_order: "dict[str, int] - Items needed for the active order"
    inspection_pending: "list[str] - Items waiting to be restocked"
    returns_pending: "list[str] - Returns waiting for inspection"
    packed_orders: "int - Number of orders ready for shipping"
    shipped_orders: "int - Number of orders successfully shipped"
    time_left: "int - Remaining steps in the episode"
  
  action_space:
    pick_<item>: "Pick a specific item from inventory"
    pack_order: "Pack the current order if all items are picked"
    ship_order: "Ship a packed order to the customer"
    inspect_return: "Process a pending return into the inspection queue"
    restock_<item>: "Move an item from inspection to inventory"
    wait: "No-op action (minimal time penalty)"

tasks:
  - id: "easy"
    difficulty: "easy"
    description: "Manage a small inventory and fulfill 3 simple orders."
  - id: "medium"
    difficulty: "medium"
    description: "Handle 6 orders with parallel worker simulations and returns."
  - id: "hard"
    difficulty: "hard"
    description: "Manage 10 complex orders with high return volume and tight deadlines."

grading:
  formula: "0.7 * (shipped / total) + 0.3 * (time_remaining / total_time)"
  threshold: 0.80