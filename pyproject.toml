[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse_priority_env"
version = "1.0.0"
description = "A real-world warehouse simulation environment for OpenEnv hackathons."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Narendra", email = "nn7116580@gmail.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "gymnasium",
    "httpx",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
