[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse_priority_env"
version = "1.0.0"
description = "A real-world warehouse simulation environment for OpenEnv hackathons."
authors = [
    { name = "Narendra", email = "help_openenvhackathon@scaler.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "gymnasium",
    "httpx",
    "requests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
